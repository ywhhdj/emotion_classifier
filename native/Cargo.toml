[workspace]
resolver = "2"
members = [
    "crates/emotion-core",
    "crates/emotion-tokenizer",
    "crates/emotion-runtime",
    "crates/emotion-postprocess",
    "crates/emotion-python",
    "crates/emotion-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ywhhdj/emotion_classifier"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
rayon = "1.8"
numpy = "0.21"
candle-core = "0.6"
candle-nn = "0.6"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
